workflows:
  aiway-native-direct:
    name: AiWay Native Direct APK
    max_build_duration: 60
    environment:
      java: 17
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/aiway-gradle
    scripts:
      - name: Configure Android SDK
        script: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Verify no backend dependency
        script: |
          set -e
          test ! -d backend
          ! grep -R "backendUrl\|CodexClient\|/api/ws" app/src/main/java || (echo "Backend reference found" && exit 1)
      - name: Validate Android resources
        script: |
          set -e
          COUNT=$(grep -R --include='*.xml' -h '<style name="Theme.AiWay"' app/src/main/res/values* 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" != "1" ]; then
            echo "Expected exactly one Theme.AiWay resource, found $COUNT"
            grep -R -n --include='*.xml' '<style name="Theme.AiWay"' app/src/main/res/values* || true
            exit 1
          fi
      - name: Build native APK
        script: |
          set -e
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/logs/**
