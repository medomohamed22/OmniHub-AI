plugins {
    id 'com.android.application'
}

def configuredAppUrl = System.getenv('APP_URL') ?: 'https://YOUR-VERCEL-DOMAIN.vercel.app'
def ciBuildNumber = System.getenv('BUILD_NUMBER')
def resolvedVersionCode = ciBuildNumber?.isInteger() ? ciBuildNumber.toInteger() : 1

afterEvaluate {
    if (!configuredAppUrl.startsWith('https://')) {
        throw new GradleException('APP_URL must start with https://')
    }
}

android {
    namespace 'com.aiway.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aiway.app'
        minSdk 24
        targetSdk 35
        versionCode resolvedVersionCode
        versionName "1.0.${resolvedVersionCode}"
        resValue 'string', 'app_url', configuredAppUrl
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
